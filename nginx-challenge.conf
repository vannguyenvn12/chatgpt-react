# HTTP server for Let's Encrypt challenge only
server {
    listen 80;
    server_name chat.icahg.com;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # For other requests, return 404 (temporary)
    location / {
        return 404;
    }
}
